<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>PTE Master — Comprehensive Navbar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 10% 20%, rgba(15, 25, 55, 1) 0%, rgba(5, 10, 30, 1) 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        .bg-grain {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        .profile-tooltip {
            visibility: hidden;
            opacity: 0;
            transform: translateY(-12px) scale(0.96);
            transition: visibility 0.2s ease, opacity 0.2s ease, transform 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            backdrop-filter: blur(16px);
            background: rgba(15, 25, 45, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.35), 0 0 0 0.5px rgba(255, 255, 255, 0.1) inset;
        }

        .profile-tooltip.show {
            visibility: visible;
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .nav-btn-hover {
            transition: all 0.2s ease;
        }

        .nav-btn-hover:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-1px);
        }

        .logout-btn:hover {
            background: rgba(220, 38, 38, 0.2);
            border-color: rgba(239, 68, 68, 0.5);
            color: #f87171;
        }

        @keyframes soft-glow {
            0% {
                box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4);
            }

            70% {
                box-shadow: 0 0 0 6px rgba(99, 102, 241, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(99, 102, 241, 0);
            }
        }

        .buy-pulse {
            animation: soft-glow 1.8s infinite;
        }

        /* Mega menu positioning */
        .nav-item {
            position: relative;
        }

        .mega-menu {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s, visibility 0.2s;
            z-index: 50;
            padding-top: 8px;
        }

        .nav-item:hover>.mega-menu {
            opacity: 1;
            visibility: visible;
        }

        .sub-item {
            position: relative;
        }

        .sub-menu {
            position: absolute;
            left: 100%;
            top: 0;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.15s, visibility 0.15s;
            z-index: 60;
            padding-left: 4px;
        }

        .sub-item:hover>.sub-menu {
            opacity: 1;
            visibility: visible;
        }

        /* Mobile menu */
        .mobile-menu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease;
        }

        .mobile-menu.open {
            max-height: 2000px;
        }

        .mobile-accordion {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .mobile-accordion.open {
            max-height: 800px;
        }
    </style>
</head>

<body class="bg-grain relative">
    <div
        class="fixed inset-0 pointer-events-none bg-[radial-gradient(ellipse_at_top,_rgba(56,89,150,0.15),_transparent_70%)]">
    </div>

    <!-- Navigation Bar -->
    <nav class="w-full sticky top-0 z-50 bg-slate-900/60 backdrop-blur-md border-b border-white/10 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16 md:h-18">
                <!-- Left: Logo & Mobile Burger -->
                <div class="flex items-center gap-4">
                    <button id="burger-btn"
                        class="md:hidden text-white/70 hover:text-white transition-colors focus:outline-none">
                        <i class="fa-solid fa-bars text-xl" id="burger-icon-open"></i>
                        <i class="fa-solid fa-xmark text-xl hidden" id="burger-icon-close"></i>
                    </button>
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-graduation-cap text-indigo-400 text-xl"></i>
                        <span class="text-white font-bold text-lg tracking-tight hidden sm:inline">PTE Master</span>
                    </div>
                </div>

                <!-- Center: Navigation Links -->
                <div class="hidden md:flex items-center space-x-1">
                    <div class="nav-item">
                        <button
                            class="px-3 py-2 rounded-lg text-sm font-medium text-white/70 hover:text-white hover:bg-white/5 transition-all flex items-center gap-1.5">
                            Practice <i class="fa-solid fa-chevron-down text-[10px] opacity-50"></i>
                        </button>
                        <div class="mega-menu">
                            <div
                                class="bg-slate-900/95 backdrop-blur-xl border border-white/10 rounded-xl shadow-2xl p-1.5 min-w-[200px]">
                                <div class="sub-item">
                                    <a href="#" onclick="event.preventDefault()"
                                        class="flex items-center justify-between px-3 py-2 rounded-lg text-sm text-white/70 hover:text-white hover:bg-white/5 transition-colors">
                                        <span class="flex items-center gap-2"><i
                                                class="fa-solid fa-microphone text-indigo-400 w-4"></i> Speaking</span>
                                        <i class="fa-solid fa-chevron-right text-[10px] opacity-30"></i>
                                    </a>
                                    <div class="sub-menu">
                                        <div
                                            class="bg-slate-900/95 backdrop-blur-xl border border-white/10 rounded-xl shadow-2xl p-1.5 min-w-[220px]">
                                            <a href="#" onclick="event.preventDefault()"
                                                class="block px-3 py-2 rounded-lg text-sm text-white/70 hover:text-white hover:bg-white/5 transition-colors">Read
                                                Aloud</a>
                                            <a href="#" onclick="event.preventDefault()"
                                                class="block px-3 py-2 rounded-lg text-sm text-white/70 hover:text-white hover:bg-white/5 transition-colors">Repeat
                                                Sentence</a>
                                            <a href="#" onclick="event.preventDefault()"
                                                class="block px-3 py-2 rounded-lg text-sm text-white/70 hover:text-white hover:bg-white/5 transition-colors">Describe
                                                Image</a>
                                        </div>
                                    </div>
                                </div>
                                <div class="sub-item">
                                    <a href="#" onclick="event.preventDefault()"
                                        class="flex items-center justify-between px-3 py-2 rounded-lg text-sm text-white/70 hover:text-white hover:bg-white/5 transition-colors">
                                        <span class="flex items-center gap-2"><i
                                                class="fa-solid fa-pen-nib text-emerald-400 w-4"></i> Writing</span>
                                        <i class="fa-solid fa-chevron-right text-[10px] opacity-30"></i>
                                    </a>
                                    <div class="sub-menu">
                                        <div
                                            class="bg-slate-900/95 backdrop-blur-xl border border-white/10 rounded-xl shadow-2xl p-1.5 min-w-[220px]">
                                            <a href="#" onclick="event.preventDefault()"
                                                class="block px-3 py-2 rounded-lg text-sm text-white/70 hover:text-white hover:bg-white/5 transition-colors">Summarise
                                                Written Text</a>
                                            <a href="#" onclick="event.preventDefault()"
                                                class="block px-3 py-2 rounded-lg text-sm text-white/70 hover:text-white hover:bg-white/5 transition-colors">Essay</a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <a href="#" onclick="event.preventDefault()"
                        class="px-3 py-2 rounded-lg text-sm font-medium text-white/70 hover:text-white hover:bg-white/5 transition-all">PTE
                        Tutorial</a>
                    <a href="#" onclick="event.preventDefault()"
                        class="px-3 py-2 rounded-lg text-sm font-medium text-white/70 hover:text-white hover:bg-white/5 transition-all">Pricing</a>
                    <a href="#" onclick="event.preventDefault()"
                        class="px-3 py-2 rounded-lg text-sm font-medium text-white/70 hover:text-white hover:bg-white/5 transition-all">Q&amp;A</a>
                </div>

                <!-- Right: Auth/User Section -->
                <div class="flex items-center space-x-3 sm:space-x-4">
                    <!-- Guest State -->
                    <div id="guest-state" class="hidden flex items-center gap-2">
                        <button onclick="toggleAuth()"
                            class="text-white/70 hover:text-white text-sm font-medium px-4 py-2 rounded-full transition-colors">Log
                            In</button>
                        <button onclick="toggleAuth()"
                            class="bg-indigo-500/20 hover:bg-indigo-500/35 text-white border border-indigo-400/40 rounded-full px-5 py-2 backdrop-blur-sm transition-all font-medium text-sm">Sign
                            Up</button>
                    </div>

                    <!-- Authenticated State -->
                    <div id="auth-state" class="flex items-center space-x-3 sm:space-x-4">
                        <div
                            class="flex items-center space-x-2 bg-white/5 backdrop-blur-sm px-3 py-1.5 rounded-full border border-white/15 shadow-sm">
                            <i class="fa-solid fa-coins text-indigo-300 text-sm"></i>
                            <span class="font-semibold text-white/90 text-sm tracking-wide"
                                id="tokenAmountDisplay">2,450.75</span>
                            <span class="text-white/50 text-xs font-medium hidden sm:inline">Tokens</span>
                        </div>

                        <button id="buyTokenBtn"
                            class="buy-pulse nav-btn-hover hidden sm:flex items-center gap-2 bg-indigo-500/20 hover:bg-indigo-500/35 text-white border border-indigo-400/40 rounded-full px-5 py-2 backdrop-blur-sm transition-all duration-200 font-medium text-sm">
                            <i class="fa-solid fa-store text-indigo-200 text-xs"></i>
                            <span>Buy Token</span>
                        </button>

                        <div class="relative">
                            <button id="profileIconBtn"
                                class="flex items-center justify-center w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-white/10 backdrop-blur-sm border border-white/25 text-white hover:bg-white/20 transition-all focus:outline-none">
                                <i class="fa-regular fa-user text-base"></i>
                            </button>

                            <div id="profileTooltip"
                                class="profile-tooltip absolute right-0 mt-3 w-56 rounded-xl overflow-hidden z-50 origin-top-right">
                                <div class="py-2 px-1 flex flex-col">
                                    <div class="px-3 py-2 border-b border-white/10 mb-1">
                                        <p class="text-white/80 text-xs font-medium">Signed in as</p>
                                        <p class="text-white text-sm font-semibold truncate">jane.doe@example.com</p>
                                    </div>
                                    <button
                                        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-white/80 hover:text-white hover:bg-white/5 transition-all text-sm font-medium">
                                        <i class="fa-regular fa-user w-4 text-indigo-300"></i>
                                        <span>My Profile</span>
                                    </button>
                                    <button id="logoutBtn" onclick="toggleAuth()"
                                        class="logout-btn flex items-center gap-3 px-3 py-2.5 rounded-lg text-white/80 hover:text-white transition-all text-sm font-medium group">
                                        <i
                                            class="fa-solid fa-arrow-right-from-bracket w-4 text-red-300 group-hover:text-red-400"></i>
                                        <span>Log out</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Mobile Menu -->
        <div id="mobile-menu" class="mobile-menu md:hidden bg-slate-900/90 backdrop-blur-xl border-t border-white/10">
            <div class="px-4 py-3 space-y-1">
                <div>
                    <button onclick="toggleMobileAccordion('practice-acc')"
                        class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-sm font-medium text-white/70 hover:text-white hover:bg-white/5">
                        Practice <i class="fa-solid fa-chevron-down text-xs opacity-50 transition-transform"
                            id="practice-acc-icon"></i>
                    </button>
                    <div id="practice-acc" class="mobile-accordion pl-4 space-y-0.5">
                        <a href="#" onclick="event.preventDefault()"
                            class="block px-3 py-2 rounded-lg text-sm text-white/60 hover:text-white hover:bg-white/5">Speaking</a>
                        <a href="#" onclick="event.preventDefault()"
                            class="block px-3 py-2 rounded-lg text-sm text-white/60 hover:text-white hover:bg-white/5">Writing</a>
                    </div>
                </div>
                <a href="#" onclick="event.preventDefault()"
                    class="block px-3 py-2.5 rounded-lg text-sm font-medium text-white/70 hover:text-white hover:bg-white/5">PTE
                    Tutorial</a>
                <a href="#" onclick="event.preventDefault()"
                    class="block px-3 py-2.5 rounded-lg text-sm font-medium text-white/70 hover:text-white hover:bg-white/5">Pricing</a>
                <a href="#" onclick="event.preventDefault()"
                    class="block px-3 py-2.5 rounded-lg text-sm font-medium text-white/70 hover:text-white hover:bg-white/5">Q&amp;A</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="h-full flex items-center justify-center pt-24">
        <div class="text-white/20 select-none pointer-events-none text-sm uppercase tracking-widest">Blank Page Content</div>
        <button onclick="toggleAuth()" class="absolute inset-0 w-full h-full opacity-0 cursor-default" aria-label="Toggle state"></button>
    </main>

    <script>
        // DOM Elements
        const burgerBtn = document.getElementById('burger-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        const iconOpen = document.getElementById('burger-icon-open');
        const iconClose = document.getElementById('burger-icon-close');
        const profileBtn = document.getElementById('profileIconBtn');
        const tooltip = document.getElementById('profileTooltip');
        const guestState = document.getElementById('guest-state');
        const authState = document.getElementById('auth-state');

        let isLoggedIn = true;
        let menuOpen = false;

        // Toggles
        function toggleAuth() {
            isLoggedIn = !isLoggedIn;
            updateAuthState();
            closeTooltip();
        }

        function updateAuthState() {
            if (isLoggedIn) {
                guestState.classList.add('hidden');
                authState.classList.remove('hidden');
                authState.classList.add('flex');
            } else {
                guestState.classList.remove('hidden');
                guestState.classList.add('flex');
                authState.classList.add('hidden');
            }
        }

        burgerBtn.addEventListener('click', () => {
            menuOpen = !menuOpen;
            mobileMenu.classList.toggle('open', menuOpen);
            iconOpen.classList.toggle('hidden', menuOpen);
            iconClose.classList.toggle('hidden', !menuOpen);
        });

        function toggleMobileAccordion(id) {
            const el = document.getElementById(id);
            const icon = document.getElementById(id + '-icon');
            el.classList.toggle('open');
            if (icon) icon.style.transform = el.classList.contains('open') ? 'rotate(180deg)' : '';
        }

        function openTooltip() {
            tooltip.classList.add('show');
        }

        function closeTooltip() {
            tooltip.classList.remove('show');
        }

        profileBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            tooltip.classList.contains('show') ? closeTooltip() : openTooltip();
        });

        document.addEventListener('click', (e) => {
            if (!profileBtn.contains(e.target) && !tooltip.contains(e.target)) closeTooltip();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeTooltip();
        });

        // Initialize
        updateAuthState();
    </script>
</body>

</html>

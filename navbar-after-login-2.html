<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTE Master — Glass Navbar (Plain HTML/JS)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background: radial-gradient(circle at 10% 20%, #0f172a 0%, #020617 100%);
            min-height: 100vh;
        }
        .mega-menu { display: none; position: absolute; top: 100%; left: 0; padding-top: 0.5rem; z-index: 50; }
        .nav-item:hover .mega-menu { display: block; }
        .mobile-menu { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
        .mobile-menu.open { max-height: 100vh; }
    </style>
</head>

<body class="text-white">
    <!-- GLASS NAVBAR -->
    <nav class="sticky top-0 z-50 bg-slate-900/60 backdrop-blur-md border-b border-white/10 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Left -->
                <div class="flex items-center gap-4">
                    <button onclick="document.getElementById('mob-nav').classList.toggle('open')" class="md:hidden text-white/70 hover:text-white">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-graduation-cap text-indigo-400 text-xl"></i>
                        <span class="font-bold text-lg">PTE Master</span>
                    </div>
                </div>

                <!-- Center -->
                <div class="hidden md:flex items-center space-x-1">
                    <div class="nav-item relative">
                        <button class="px-3 py-2 text-sm font-medium text-white/70 hover:text-white flex items-center gap-1.5">
                            Practice <i class="fa-solid fa-chevron-down text-[10px]"></i>
                        </button>
                        <div class="mega-menu">
                            <div class="bg-slate-900/95 backdrop-blur-xl border border-white/10 rounded-xl shadow-2xl p-2 min-w-[200px]">
                                <a href="#" class="block px-3 py-2 text-sm text-white/70 hover:text-white hover:bg-white/5 rounded-lg">Speaking</a>
                                <a href="#" class="block px-3 py-2 text-sm text-white/70 hover:text-white hover:bg-white/5 rounded-lg">Writing</a>
                            </div>
                        </div>
                    </div>
                    <a href="#" class="px-3 py-2 text-sm font-medium text-white/70 hover:text-white">Tutorial</a>
                    <a href="#" class="px-3 py-2 text-sm font-medium text-white/70 hover:text-white">Pricing</a>
                </div>

                <!-- Right -->
                <div class="flex items-center gap-4">
                    <div id="guest-box" class="hidden flex gap-2">
                        <button onclick="toggle(true)" class="text-sm font-medium text-white/70">Log In</button>
                        <button onclick="toggle(true)" class="bg-indigo-500/20 border border-indigo-400/40 px-4 py-1.5 rounded-full text-sm">Sign Up</button>
                    </div>
                    <div id="auth-box" class="flex items-center gap-4">
                        <div class="flex items-center gap-2 bg-white/5 px-3 py-1.5 rounded-full border border-white/10 text-sm">
                            <i class="fa-solid fa-coins text-indigo-400"></i> <span>2,450.75</span>
                        </div>
                        <div class="relative">
                            <button onclick="document.getElementById('drop').classList.toggle('hidden')" class="w-10 h-10 rounded-full bg-white/10 border border-white/20 flex items-center justify-center">
                                <i class="fa-regular fa-user"></i>
                            </button>
                            <div id="drop" class="hidden absolute right-0 mt-3 w-48 bg-slate-900/90 border border-white/10 rounded-xl shadow-2xl overflow-hidden backdrop-blur-xl">
                                <div class="px-4 py-2 border-b border-white/5 text-[10px] text-white/50">jane.doe@example.com</div>
                                <button onclick="toggle(false)" class="w-full text-left px-4 py-2 text-sm hover:bg-white/5 text-red-400">Log out</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Mobile -->
        <div id="mob-nav" class="mobile-menu md:hidden bg-slate-900 border-t border-white/10">
            <div class="p-4 space-y-2">
                <a href="#" class="block text-white/70">Practice</a>
                <a href="#" class="block text-white/70">Tutorial</a>
                <a href="#" class="block text-white/70">Pricing</a>
            </div>
        </div>
    </nav>

    <main class="pt-24 text-center text-white/10 uppercase tracking-tighter select-none">
        Blank Body
    </main>

    <script>
        function toggle(loggedIn) {
            document.getElementById('guest-box').classList.toggle('hidden', loggedIn);
            document.getElementById('auth-box').classList.toggle('hidden', !loggedIn);
            document.getElementById('drop').classList.add('hidden');
        }
    </script>
</body>

</html>

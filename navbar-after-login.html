<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glass Nav Bar</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Space+Mono:wght@700&amp;display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; }

    .tooltip-enter { animation: tooltipIn 0.2s ease-out forwards; }
    .tooltip-exit { animation: tooltipOut 0.15s ease-in forwards; }

    @keyframes tooltipIn {
      from { opacity: 0; transform: translateY(-8px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes tooltipOut {
      from { opacity: 1; transform: translateY(0) scale(1); }
      to { opacity: 0; transform: translateY(-8px) scale(0.95); }
    }

    .token-glow {
      text-shadow: 0 0 12px rgba(250, 204, 21, 0.4);
    }

    .buy-btn {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      transition: all 0.25s ease;
    }
    .buy-btn:hover {
      background: linear-gradient(135deg, #60a5fa, #3b82f6);
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
      transform: translateY(-1px);
    }

    .profile-ring {
      background: conic-gradient(#7c3aed, #06b6d4, #7c3aed);
      padding: 2px;
      border-radius: 50%;
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .profile-ring:hover {
      box-shadow: 0 0 16px rgba(124, 58, 237, 0.5);
      transform: scale(1.05);
    }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full">

   <!-- Nav Bar -->
   <nav class="w-full px-5 py-3 flex items-center justify-between" style="background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,255,255,0.07);">
    <!-- Left: Brand -->
    <div class="flex items-center gap-2">
     <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background: linear-gradient(135deg, #7c3aed, #06b6d4);">
      <i data-lucide="zap" style="width:18px;height:18px;color:#fff;"></i>
     </div><span id="brand-name" class="text-white font-bold text-lg tracking-tight" style="font-family:'Space Mono',monospace;">NexusPay</span>
    </div><!-- Right: Tokens + Buy + Profile -->
    <div class="flex items-center gap-4 relative">
     <!-- Token Amount -->
     <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full" style="background: rgba(250, 204, 21, 0.08); border: 1px solid rgba(250, 204, 21, 0.2);">

<span id="token-count" class="text-yellow-400 font-semibold text-sm token-glow">1,250</span> <span class="text-yellow-500 font-semibold text-xs token-glow">Tokens</span>
     </div><!-- Buy Tokens Button --> <button id="buy-btn" class="buy-btn text-white text-sm font-semibold px-4 py-2 rounded-full flex items-center gap-1.5 border-0 cursor-pointer">

<span id="buy-btn-text">Buy Tokens</span> </button> <!-- Profile Icon -->
     <div class="relative" id="profile-wrapper">
      <button id="profile-btn" class="profile-ring border-0 cursor-pointer bg-transparent" aria-label="Profile menu" aria-expanded="false">
       <div class="w-9 h-9 rounded-full flex items-center justify-center" style="background: #1e293b;">
        <i data-lucide="user" style="width:18px;height:18px;color:#94a3b8;"></i>
       </div></button> <!-- Tooltip Dropdown -->
      <div id="profile-tooltip" class="hidden absolute right-0 mt-2 w-52 rounded-xl overflow-hidden z-50" style="background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
       <!-- User Info -->
       <div class="px-4 pt-4 pb-3 flex items-center gap-3" style="border-bottom: 1px solid rgba(255,255,255,0.07);">
        <div class="w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0" style="background: linear-gradient(135deg, #7c3aed, #06b6d4);">
         <span class="text-white font-bold text-sm">JD</span>
        </div>
        <div class="min-w-0">
         <p class="text-white font-semibold text-sm truncate">Jane Doe</p>
         <p class="text-slate-400 text-xs truncate">jane@example.com</p>
        </div>
       </div><!-- Menu Items -->
       <div class="py-1.5">
        <a href="#" class="flex items-center gap-2.5 px-4 py-2.5 text-slate-300 text-sm no-underline transition-colors hover:bg-white/5" onclick="event.preventDefault()"> <i data-lucide="user" style="width:15px;height:15px;color:#94a3b8;"></i> My Profile </a> <a href="#" class="flex items-center gap-2.5 px-4 py-2.5 text-slate-300 text-sm no-underline transition-colors hover:bg-white/5" onclick="event.preventDefault()"> <i data-lucide="settings" style="width:15px;height:15px;color:#94a3b8;"></i> Settings </a>
       </div><!-- Logout -->
       <div style="border-top: 1px solid rgba(255,255,255,0.07);" class="py-1.5">
        <a href="#" id="logout-btn" class="flex items-center gap-2.5 px-4 py-2.5 text-red-400 text-sm no-underline transition-colors hover:bg-red-500/10" onclick="event.preventDefault()"> <i data-lucide="log-out" style="width:15px;height:15px;color:#f87171;"></i> Log Out </a>
       </div>
      </div>
     </div>
    </div>
   </nav><!-- Placeholder content -->
   <div class="flex items-center justify-center" style="height: calc(100% - 60px); opacity: 0.3;">
    <p class="text-slate-500 text-sm tracking-widest uppercase">Page Content</p>
   </div>
  </div>
  <script>
    lucide.createIcons();

    // Tooltip toggle
    const profileBtn = document.getElementById('profile-btn');
    const tooltip = document.getElementById('profile-tooltip');
    let tooltipOpen = false;

    function openTooltip() {
      tooltip.classList.remove('hidden', 'tooltip-exit');
      tooltip.classList.add('tooltip-enter');
      profileBtn.setAttribute('aria-expanded', 'true');
      tooltipOpen = true;
    }

    function closeTooltip() {
      tooltip.classList.remove('tooltip-enter');
      tooltip.classList.add('tooltip-exit');
      profileBtn.setAttribute('aria-expanded', 'false');
      tooltipOpen = false;
      setTimeout(() => { if (!tooltipOpen) tooltip.classList.add('hidden'); }, 150);
    }

    profileBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      tooltipOpen ? closeTooltip() : openTooltip();
    });

    document.addEventListener('click', (e) => {
      if (tooltipOpen && !document.getElementById('profile-wrapper').contains(e.target)) closeTooltip();
    });

    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && tooltipOpen) closeTooltip(); });

    // Logout inline confirmation
    const logoutBtn = document.getElementById('logout-btn');
    logoutBtn.addEventListener('click', (e) => {
      e.preventDefault();
      const parent = logoutBtn.parentElement;
      logoutBtn.style.display = 'none';
      const confirm = document.createElement('div');
      confirm.className = 'px-4 py-2.5 flex items-center gap-2';
      confirm.innerHTML = `
        <span class="text-red-400 text-sm flex-1">Log out?</span>
        <button class="text-xs font-semibold text-white bg-red-500 hover:bg-red-600 rounded-md px-2.5 py-1 border-0 cursor-pointer transition-colors" id="confirm-yes">Yes</button>
        <button class="text-xs font-semibold text-slate-400 hover:text-white rounded-md px-2.5 py-1 border-0 cursor-pointer bg-transparent transition-colors" id="confirm-no">Cancel</button>
      `;
      parent.appendChild(confirm);
      document.getElementById('confirm-no').addEventListener('click', () => { confirm.remove(); logoutBtn.style.display = 'flex'; });
      document.getElementById('confirm-yes').addEventListener('click', () => { confirm.innerHTML = '<span class="text-slate-400 text-sm px-4 py-1">Logged out ✓</span>'; });
    });

    // Element SDK
    const defaultConfig = {
      brand_name: 'NexusPay',
      token_count: '1,250',
      buy_button_text: 'Buy Tokens',
      background_color: '#0f172a',
      surface_color: '#1e293b',
      text_color: '#e2e8f0',
      primary_action: '#7c3aed',
      secondary_action: '#06b6d4'
    };

    function applyConfig(config) {
      const c = { ...defaultConfig, ...config };
      document.getElementById('brand-name').textContent = c.brand_name;
      document.getElementById('token-count').textContent = c.token_count;
      document.getElementById('buy-btn-text').textContent = c.buy_button_text;

      // Colors
      const wrapper = document.getElementById('app-wrapper');
      wrapper.style.background = `linear-gradient(135deg, ${c.background_color} 0%, ${c.primary_action}22 40%, ${c.background_color} 100%)`;

      document.querySelectorAll('.buy-btn').forEach(b => {
        b.style.background = `linear-gradient(135deg, ${c.primary_action}, ${c.primary_action}dd)`;
      });

      const fonts = c.font_family ? `${c.font_family}, DM Sans, sans-serif` : 'DM Sans, sans-serif';
      document.body.style.fontFamily = fonts;

      if (c.font_size) {
        const s = c.font_size;
        document.getElementById('brand-name').style.fontSize = `${s * 1.15}px`;
        document.getElementById('token-count').style.fontSize = `${s * 0.875}px`;
        document.getElementById('buy-btn-text').style.fontSize = `${s * 0.875}px`;
      }
    }

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange: async (config) => applyConfig(config),
        mapToCapabilities: (config) => ({
          recolorables: [
            { get: () => config.background_color || defaultConfig.background_color, set: (v) => { config.background_color = v; window.elementSdk.setConfig({ background_color: v }); } },
            { get: () => config.surface_color || defaultConfig.surface_color, set: (v) => { config.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); } },
            { get: () => config.text_color || defaultConfig.text_color, set: (v) => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); } },
            { get: () => config.primary_action || defaultConfig.primary_action, set: (v) => { config.primary_action = v; window.elementSdk.setConfig({ primary_action: v }); } },
            { get: () => config.secondary_action || defaultConfig.secondary_action, set: (v) => { config.secondary_action = v; window.elementSdk.setConfig({ secondary_action: v }); } }
          ],
          borderables: [],
          fontEditable: {
            get: () => config.font_family || defaultConfig.font_family || '',
            set: (v) => { config.font_family = v; window.elementSdk.setConfig({ font_family: v }); }
          },
          fontSizeable: {
            get: () => config.font_size || defaultConfig.font_size || 16,
            set: (v) => { config.font_size = v; window.elementSdk.setConfig({ font_size: v }); }
          }
        }),
        mapToEditPanelValues: (config) => new Map([
          ['brand_name', config.brand_name || defaultConfig.brand_name],
          ['token_count', config.token_count || defaultConfig.token_count],
          ['buy_button_text', config.buy_button_text || defaultConfig.buy_button_text]
        ])
      });
    }
  </script>

<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTE Master Navbar — Plain HTML/JS</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <style>
        .mega-menu {
            display: none; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
            padding-top: 0.5rem; z-index: 50;
        }
        .nav-item:hover .mega-menu { display: block; }
        .sub-menu {
            display: none; position: absolute; left: 100%; top: 0; padding-left: 0.25rem;
        }
        .sub-item:hover .sub-menu { display: block; }
        .mobile-menu { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
        .mobile-menu.open { max-height: 100vh; }
        .mobile-accordion { max-height: 0; overflow: hidden; transition: max-height 0.2s ease-out; }
        .mobile-accordion.open { max-height: 500px; }
    </style>
</head>

<body class="bg-slate-950 font-sans text-white">
    <!-- NAVBAR START -->
    <nav class="fixed top-0 left-0 w-full z-50 border-b border-white/10 bg-slate-900/80 backdrop-blur-xl">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Brand & Burger -->
                <div class="flex items-center gap-4">
                    <button onclick="document.getElementById('mobile-menu').classList.toggle('open')" class="md:hidden p-2 text-slate-400 hover:text-white">
                        <i data-lucide="menu"></i>
                    </button>
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 rounded-lg bg-sky-500 flex items-center justify-center font-bold">P</div>
                        <span class="text-xl font-bold tracking-tight">PTE Master</span>
                    </div>
                </div>

                <!-- Desktop Links -->
                <div class="hidden md:flex items-center gap-2">
                    <div class="nav-item relative">
                        <button class="px-3 py-2 text-sm font-medium text-slate-300 hover:text-white flex items-center gap-1">
                            Practice <i data-lucide="chevron-down" class="w-4 h-4 opacity-50"></i>
                        </button>
                        <div class="mega-menu">
                            <div class="bg-slate-900 border border-white/10 rounded-xl shadow-2xl p-1.5 min-w-[180px]">
                                <div class="sub-item relative">
                                    <button class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm text-slate-300 hover:text-white hover:bg-white/5">
                                        Speaking <i data-lucide="chevron-right" class="w-4 h-4 opacity-30"></i>
                                    </button>
                                    <div class="sub-menu">
                                        <div class="bg-slate-900 border border-white/10 rounded-xl p-1.5 min-w-[180px]">
                                            <a href="#" class="block px-3 py-2 text-sm text-slate-300 hover:text-white hover:bg-white/5">Read Aloud</a>
                                            <a href="#" class="block px-3 py-2 text-sm text-slate-300 hover:text-white hover:bg-white/5">Repeat Sentence</a>
                                        </div>
                                    </div>
                                </div>
                                <div class="sub-item relative">
                                    <button class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm text-slate-300 hover:text-white hover:bg-white/5">
                                        Writing <i data-lucide="chevron-right" class="w-4 h-4 opacity-30"></i>
                                    </button>
                                    <div class="sub-menu">
                                        <div class="bg-slate-900 border border-white/10 rounded-xl p-1.5 min-w-[180px]">
                                            <a href="#" class="block px-3 py-2 text-sm text-slate-300 hover:text-white hover:bg-white/5">Summarise Text</a>
                                            <a href="#" class="block px-3 py-2 text-sm text-slate-300 hover:text-white hover:bg-white/5">Essay</a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <a href="#" class="px-3 py-2 text-sm font-medium text-slate-300 hover:text-white transition">Pricing</a>
                    <a href="#" class="px-3 py-2 text-sm font-medium text-slate-300 hover:text-white transition">Tutorial</a>
                </div>

                <!-- User Section -->
                <div class="flex items-center gap-4">
                    <!-- Guest -->
                    <div id="guest-ui" class="hidden flex items-center gap-2">
                        <button onclick="toggleUser(true)" class="text-sm font-medium text-slate-300 hover:text-white">Log In</button>
                        <button onclick="toggleUser(true)" class="bg-sky-500 hover:bg-sky-400 text-white text-sm font-semibold px-4 py-2 rounded-lg">Sign Up</button>
                    </div>
                    <!-- Authenticated -->
                    <div id="auth-ui" class="flex items-center gap-4">
                        <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-sky-500/10 border border-sky-500/20">
                            <i data-lucide="coins" class="w-4 h-4 text-sky-400"></i>
                            <span class="text-sky-300 font-bold text-sm">1,250</span>
                        </div>
                        <div class="relative">
                            <button onclick="document.getElementById('prof-drop').classList.toggle('hidden')" class="w-9 h-9 rounded-full bg-slate-800 flex items-center justify-center border border-white/10 hover:border-sky-500/50 transition">
                                <i data-lucide="user" class="w-5 h-5 text-slate-400"></i>
                            </button>
                            <div id="prof-drop" class="hidden absolute right-0 mt-2 w-48 bg-slate-900 border border-white/10 rounded-xl shadow-2xl overflow-hidden">
                                <div class="px-4 py-3 border-b border-white/5 text-xs text-slate-500">student@ptemaster.com</div>
                                <div class="p-1">
                                    <button onclick="toggleUser(false)" class="w-full text-left px-3 py-2 text-sm text-rose-400 hover:bg-rose-500/10 rounded-lg">Log Out</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Mobile Content -->
        <div id="mobile-menu" class="mobile-menu md:hidden bg-slate-900 border-t border-white/10">
            <div class="px-4 py-3 space-y-1">
                <button onclick="document.getElementById('mob-practice').classList.toggle('open')" class="w-full flex items-center justify-between px-3 py-2 text-slate-300">
                    Practice <i data-lucide="chevron-down" class="w-4 h-4"></i>
                </button>
                <div id="mob-practice" class="mobile-accordion pl-4 space-y-1">
                    <a href="#" class="block px-3 py-1.5 text-sm text-slate-400 hover:text-white">Speaking</a>
                    <a href="#" class="block px-3 py-1.5 text-sm text-slate-400 hover:text-white">Writing</a>
                </div>
                <a href="#" class="block px-3 py-2 text-slate-300 hover:text-white">Pricing</a>
                <a href="#" class="block px-3 py-2 text-slate-300 hover:text-white">Tutorial</a>
            </div>
        </div>
    </nav>
    <!-- NAVBAR END -->

    <main class="h-screen flex items-center justify-center text-slate-800 text-xs uppercase tracking-widest">
        Page content area (Click items to test)
    </main>

    <script>
        lucide.createIcons();
        function toggleUser(isLoggedIn) {
            document.getElementById('guest-ui').classList.toggle('hidden', isLoggedIn);
            document.getElementById('auth-ui').classList.toggle('hidden', !isLoggedIn);
            document.getElementById('prof-drop').classList.add('hidden');
        }
    </script>
</body>

</html>
